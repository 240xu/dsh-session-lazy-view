<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Lazy View</title>
<style>
	:root { color-scheme: dark; }
	body { font: 13px/1.5 ui-monospace, monospace; margin: 0; padding: 16px; background: #11151c; color: #d7dde6; }
	h1 { font-size: 16px; margin: 0 0 12px; }
	h2 { font-size: 13px; margin: 18px 0 6px; color: #8ab4f8; }
	table { border-collapse: collapse; width: 100%; }
	td, th { padding: 3px 8px; border-bottom: 1px solid #232a35; text-align: left; white-space: nowrap; }
	.big { color: #f28b82; font-weight: 700; }
	.fmt { color: #81c995; }
	button { background: #2a3342; color: #d7dde6; border: 1px solid #3a465a; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
	button:hover { background: #37435a; }
	.frame { background: #161b24; border: 1px solid #232a35; border-radius: 6px; margin: 8px 0; padding: 8px 12px; }
	.frame .meta { color: #9aa0a6; font-size: 11px; }
	.ev { margin: 6px 0; padding-left: 8px; border-left: 2px solid #3a465a; white-space: pre-wrap; word-break: break-word; }
	.ev .role { color: #fdd663; font-weight: 700; }
	.ev .ty { color: #8ab4f8; }
	.err { color: #f28b82; }
	#status { color: #9aa0a6; margin: 8px 0; }
	details { margin: 4px 0; }
	summary { cursor: pointer; }
	/* 惰性加载状态条：普通块，不做 sticky（sticky 几何会干扰滚动判定） */
	.topbar { background: #11151c; padding: 4px 0; color: #9aa0a6; font-size: 11px; }
	.topbar.loading { color: #fdd663; }
	.sentinel { height: 1px; }
</style>
</head>
<body>
<h1>dsh-session-lazy-view <span class="fmt">read-only</span></h1>
<div id="status">loading…</div>
<div id="root"></div>
<script>
const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B";
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// 首屏与每批帧数：8 帧足够铺满手机一屏；服务端 MAX_FRAMES=20 是硬上限
const BATCH = 8;

async function api(path) {
	const res = await fetch(path);
	const body = await res.json();
	if (!body.ok) throw new Error(body.error?.code + ": " + body.error?.message);
	return body.value;
}

function renderFrame(frame) {
	if (frame.error) return `<div class="frame err">frame #${frame.index} @${frame.start}: ${esc(frame.error)}</div>`;
	const events = (frame.events || []).map(ev =>
		`<div class="ev"><span class="role">${esc(ev.role)}</span> <span class="ty">${esc(ev.type)}/${esc(ev.kind)}</span> ${esc(ev.text)}</div>`
	).join("");
	const headerLine = frame.header ? ` <span class="meta">${esc(frame.header.id ?? "")}</span>` : "";
	return `<div class="frame" data-fidx="${frame.index}"><div class="meta">frame #${frame.index} · bytes ${frame.start}–${frame.end}${headerLine}</div>${events}</div>`;
}

/**
 * 一个已打开会话的惰性状态。显示按时间正序（旧上新下，与 Trajectory 一致）：
 * 服务端按"从文件尾倒数"给帧（index 0 = 最新），我们反转后正序渲染；
 * 首屏渲染后滚到最新；用户滚近顶部时自动预载更早一批并锚定视口。
 * 手动按钮保留作兜底（滚动监听失效的场景，如老浏览器）。
 */
function openSession(path, container) {
	const state = { path, container, skip: 0, oldestLoaded: null, loading: false, exhausted: false };
	const topbar = document.createElement("div");
	topbar.className = "topbar";
	topbar.innerHTML = `<span class="hint">loading…</span> <button data-prev style="display:none">↑ 加载更早</button>`;
	// 哨兵：始终是已加载内容的最顶元素。进入视口上方 240px 即触发预载——
	// 不依赖 sticky/滚动几何，手机浏览器上确定性强
	const sentinel = document.createElement("div");
	sentinel.className = "sentinel";
	container.innerHTML = "";
	container.appendChild(topbar);
	container.appendChild(sentinel);
	const list = document.createElement("div");
	container.appendChild(list);

	const hint = topbar.querySelector(".hint");
	const prevBtn = topbar.querySelector("[data-prev]");
	const setHint = (text, loading) => { hint.textContent = text; topbar.classList.toggle("loading", !!loading); };

	async function loadOlder() {
		if (state.loading || state.exhausted) return;
		state.loading = true;
		prevBtn.style.display = "none";
		setHint(`loading earlier frames (skip=${state.skip})…`, true);
		try {
			const value = await api(`/lazyview/api/tail?path=${encodeURIComponent(path)}&frames=${BATCH}&skip=${state.skip}`);
			// 时间正序渲染：服务端 newest-first，反转后 append 到内容最前面
			const chrono = value.frames.slice().reverse();
			if (chrono.length < BATCH) state.exhausted = true;
			if (!chrono.length && state.skip === 0) {
				setHint("no readable frames", false);
				return;
			}
			// 视口锚定：记录当前最顶帧的视口位置，prepend 后补偿滚动量
			const first = list.firstElementChild;
			const anchorTop = first ? first.getBoundingClientRect().top : null;
			const html = chrono.map(renderFrame).join("");
			list.insertAdjacentHTML("afterbegin", html);
			if (anchorTop !== null) {
				const delta = list.firstElementChild.getBoundingClientRect().top - anchorTop;
				if (delta > 0) window.scrollBy(0, delta);
			}
			state.skip += BATCH;
			const oldest = chrono[0];
			state.oldestLoaded = oldest.index;
			if (state.exhausted) {
				setHint(`已到文件头（共 ${fmtBytes(value.size)}，最早 frame #${oldest.index}）`, false);
				prevBtn.style.display = "none";
			} else {
				setHint(`file ${fmtBytes(value.size)} · 最早已载入 frame #${oldest.index} · 滚到顶部自动加载更早`, false);
				prevBtn.style.display = "";
			}
		} catch (error) {
			setHint(`error: ${error.message}`, false);
			prevBtn.style.display = "";
		} finally {
			state.loading = false;
		}
	}

	prevBtn.addEventListener("click", loadOlder);
	// 首屏：载入最新 BATCH 帧，然后滚到内容底部（最新），用户往上翻即触发预载
	loadOlder().then(() => {
		container.scrollIntoView({ block: "start" });
		const scroller = document.scrollingElement;
		scroller.scrollTop = scroller.scrollHeight;
	});
	// 哨兵观察器：rootMargin 向上扩 240px，哨兵进入"视口上方 240px"区域就预载。
	// 预载后视口锚定把哨兵推出触发区 → 自动停；再往上翻到顶 → 再次触发。到头后 disconnect。
	const io = new IntersectionObserver(entries => {
		for (const e of entries) {
			if (e.isIntersecting) {
				if (state.exhausted) { io.disconnect(); continue; }
				loadOlder();
			}
		}
	}, { rootMargin: "240px 0px 0px 0px", threshold: 0 });
	io.observe(sentinel);
}

(async () => {
	const status = document.getElementById("status");
	const root = document.getElementById("root");
	try {
		const { projects } = await api("/lazyview/api/list");
		const total = projects.reduce((n, p) => n + p.sessions.length, 0);
		status.textContent = `${projects.length} projects · ${total} sessions · 点击 session 打开（新窗口语义：打开即看最新，滚到顶部自动加载更早）`;
		for (const { project, sessions } of projects) {
			const rows = sessions.map(s => {
				const sizeCell = s.big ? `<td class="big">${fmtBytes(s.bytes)}</td>` : `<td>${fmtBytes(s.bytes)}</td>`;
				return `<tr><td>${esc(s.sessionId)}</td><td class="fmt">${esc(s.format)}</td>${sizeCell}<td>${new Date(s.mtime).toLocaleString()}</td>` +
					`<td><button data-path="${esc(s.path)}">打开</button></td></tr>`;
			}).join("");
			const section = document.createElement("details");
			section.innerHTML = `<summary><h2 style="display:inline">${esc(project)} (${sessions.length})</h2></summary>` +
				`<table><tr><th>session</th><th>format</th><th>size</th><th>mtime</th><th></th></tr>${rows}</table>`;
			for (const btn of section.querySelectorAll("[data-path]")) {
				btn.addEventListener("click", () => {
					let tail = section.querySelector(":scope > .tail");
					if (!tail) { tail = document.createElement("div"); tail.className = "tail"; section.appendChild(tail); }
					openSession(btn.dataset.path, tail);
				});
			}
			root.appendChild(section);
		}
	} catch (error) {
		status.innerHTML = `<span class="err">${esc(error.message)}</span>`;
	}
})();
</script>
</body>
</html>
